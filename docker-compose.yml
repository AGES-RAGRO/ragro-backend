services:
  postgres:
    image: postgres:16-alpine
    container_name: ragro-postgres
    environment:
      POSTGRES_DB: gearheads
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/00-create-keycloak-db.sh:/docker-entrypoint-initdb.d/00-create-keycloak-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ragro-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: ragro-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HTTP_PORT: 8180
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://localhost:8180
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/ragro-realm.json:/opt/keycloak/data/import/ragro-realm.json
      - ./keycloak/themes:/opt/keycloak/themes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ragro-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: ragro-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ragro-network

  mailpit:
    image: axllent/mailpit
    container_name: ragro-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web Interface
    networks:
      - ragro-network

  ollama:
    image: ollama/ollama:latest
    container_name: ragro-ollama
    mem_limit: 3g
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama_models:/root/.ollama
      - ./data/ollama-entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ragro-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragro-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gearheads
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      KEYCLOAK_SERVER_URL: http://keycloak:8180
      KEYCLOAK_PUBLIC_URL: http://localhost:8180
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/ragro
      KEYCLOAK_JWK_SET_URI: http://keycloak:8180/realms/ragro/protocol/openid-connect/certs
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9000}
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: ragro-media
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-http://localhost:8080}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:2b}
      OLLAMA_CONNECT_TIMEOUT_MS: ${OLLAMA_CONNECT_TIMEOUT_MS:-2000}
      OLLAMA_READ_TIMEOUT_MS: ${OLLAMA_READ_TIMEOUT_MS:-30000}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    ports:
      - "8080:8080"
    networks:
      - ragro-network

volumes:
  postgres_data:
  minio_data:
  ollama_models:

networks:
  ragro-network:
    driver: bridge
