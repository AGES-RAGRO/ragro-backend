spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gearheads}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show_sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    locations: classpath:db/migration

  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ragro}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/ragro/protocol/openid-connect/certs}

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
      init:
        # Não tenta baixar o modelo no startup (evita falha quando o Ollama está fora).
        pull-model-strategy: never
      chat:
        options:
          model: ${OLLAMA_MODEL:gemma2:2b}
          temperature: 0.2
          format: json

# Timeouts do cliente HTTP do Ollama. O Spring AI 1.0.3 não expõe timeout via
# propriedade (só base-url), então OllamaConfig aplica estes valores ao RestClient
# do OllamaApi. O read-timeout precisa cobrir a inferência da LLM em CPU
# (gemma2:2b leva ~10s+), bem acima do default de 10s do cliente HTTP.
ollama:
  connect-timeout-ms: ${OLLAMA_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${OLLAMA_READ_TIMEOUT_MS:60000}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
  public-url: ${KEYCLOAK_PUBLIC_URL:http://localhost:8180}
  realm: ragro
  admin:
    username: ${KEYCLOAK_ADMIN:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

minio:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  public-url: ${STORAGE_PUBLIC_URL:}
  media-public-url: ${MEDIA_PUBLIC_URL:http://localhost:8080}
  region: ${STORAGE_REGION:us-east-1}
  access-key: ${STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${STORAGE_SECRET_KEY:minioadmin}
  bucket: ${STORAGE_BUCKET:ragro-media}
  presigned-expiry-seconds: ${STORAGE_PRESIGNED_EXPIRY_SECONDS:3600}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    use-root-path: true

swagger:
  production-url: ${SWAGGER_PRODUCTION_URL:}

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}

ragro:
  recommendations:
    rerank:
      # Liga/desliga o reranker por IA. Desligado, usa só a ordenação heurística.
      enabled: ${RECOMMENDATION_RERANK_ENABLED:true}

server:
  error:
    include-message: never

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
