# Credenciais NÃO têm default aqui de propósito: secret faltando no deploy derruba o boot
# (fail-fast) em vez de subir silenciosamente com credencial conhecida. Para rodar local sem
# docker-compose, use o profile "local" (SPRING_PROFILES_ACTIVE=local), que define os valores de dev.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gearheads}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show_sql: false
    properties:
      hibernate:
        format_sql: false
        # Carrega coleções LAZY em lotes de 16 (IN (...)) em vez de 1 query por entidade —
        # atenua o N+1 das listagens (ex.: items dos pedidos) sem fetch join na paginação.
        default_batch_fetch_size: 16

  flyway:
    locations: classpath:db/migration

  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ragro}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/ragro/protocol/openid-connect/certs}

  ai:
    openai:
      # A NVIDIA LLM API é compatível com o client OpenAI do Spring AI.
      base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com}
      api-key: ${NVIDIA_API_KEY:}
      # A NVIDIA LLM API não oferece embeddings — desliga p/ o autoconfig não criar o bean.
      embedding:
        enabled: false
      chat:
        options:
          # Modelo INSTRUCT (sem reasoning). Modelos de reasoning (ex.: stepfun-ai/step-3.7-flash)
          # estouram tempo/tokens reordenando os ~50 candidatos (>180s, finish_reason=length) e
          # cairiam sempre no fallback heurístico. Alternativa +qualidade/+lenta: meta/llama-3.3-70b-instruct.
          model: ${NVIDIA_MODEL:meta/llama-3.1-8b-instruct}
          temperature: 0.2
          # A NVIDIA LLM API exige max-tokens; cobre ~50 itens reordenados em JSON.
          max-tokens: ${NVIDIA_MAX_TOKENS:4096}

# Timeouts do cliente HTTP da NVIDIA LLM API. O Spring AI 1.0.3 não expõe timeout via
# propriedade para o client OpenAI e seu RestClient default não tem read-timeout, então
# NvidiaChatConfig aplica estes valores ao RestClient do OpenAiApi. O read-timeout cobre a
# inferência da LLM hospedada na NVIDIA.
nvidia:
  connect-timeout-ms: ${NVIDIA_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${NVIDIA_READ_TIMEOUT_MS:60000}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
  public-url: ${KEYCLOAK_PUBLIC_URL:http://localhost:8180}
  realm: ragro
  admin:
    username: ${KEYCLOAK_ADMIN:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD}

minio:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  media-public-url: ${MEDIA_PUBLIC_URL:http://localhost:8080}
  region: ${STORAGE_REGION:us-east-1}
  access-key: ${STORAGE_ACCESS_KEY}
  secret-key: ${STORAGE_SECRET_KEY}
  bucket: ${STORAGE_BUCKET:ragro-media}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    use-root-path: true

swagger:
  production-url: ${SWAGGER_PRODUCTION_URL:}

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}

ragro:
  recommendations:
    rerank:
      # Liga/desliga o reranker por IA. Desligado, usa só a ordenação heurística.
      enabled: ${RECOMMENDATION_RERANK_ENABLED:true}
    cache:
      # Cache do ranking por cliente (Caffeine). Ligado: hit responde em ms e a LLM roda
      # assíncrona no máximo 1×/cliente/TTL (ou após novo pedido — evicção por evento).
      # Desligado: comportamento antigo (rerank síncrono a cada chamada).
      enabled: ${RECOMMENDATION_CACHE_ENABLED:true}
      ttl-hours: ${RECOMMENDATION_CACHE_TTL_HOURS:6}
  tracking:
    # Rastreamento em tempo real (WebSocket/STOMP). Desligado, o canal /ws não sobe e
    # GET /orders/{id}/tracking responde available=false (o app cai no fluxo sem mapa).
    enabled: ${TRACKING_ENABLED:true}
    retention-days: ${TRACKING_RETENTION_DAYS:7}
  rate-limit:
    # Token bucket in-memory (RateLimitFilter): register/forgot por IP; recommendations/routes
    # por usuário (custo de LLM/Google). Limites em requisições por minuto.
    enabled: ${RATE_LIMIT_ENABLED:true}
    register-per-minute: ${RATE_LIMIT_REGISTER_PER_MINUTE:5}
    forgot-per-minute: ${RATE_LIMIT_FORGOT_PER_MINUTE:5}
    recommendations-per-minute: ${RATE_LIMIT_RECOMMENDATIONS_PER_MINUTE:10}
    routes-per-minute: ${RATE_LIMIT_ROUTES_PER_MINUTE:10}

server:
  error:
    include-message: never

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
  # Routes API: timeouts explícitos (o RestClient default do Boot não tem read-timeout — uma chamada
  # travada bloquearia o worker e impediria o retry de transporte de disparar) + backoff base do
  # retry para falhas de transporte transitórias (DNS/conexão). Read 10s porque computeRoutes
  # (TRAFFIC_AWARE + otimização de ordem) leva legitimamente alguns segundos.
  routes:
    connect-timeout-ms: ${GOOGLE_ROUTES_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${GOOGLE_ROUTES_READ_TIMEOUT_MS:10000}
    retry:
      backoff-ms: ${GOOGLE_ROUTES_RETRY_BACKOFF_MS:200}

firebase:
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
