# Credentials have no default on purpose: a missing secret fails boot (fail-fast) instead of
# silently using a known credential. For local runs without docker-compose, use the "local" profile.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gearheads}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show_sql: false
    properties:
      hibernate:
        format_sql: false
        # Batch-load LAZY collections in groups of 16 (IN (...)) to ease N+1 on listings
        # (e.g. order items) without a fetch join on paginated queries.
        default_batch_fetch_size: 16

  flyway:
    locations: classpath:db/migration

  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ragro}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/ragro/protocol/openid-connect/certs}

  ai:
    openai:
      # NVIDIA LLM API is compatible with the Spring AI OpenAI client.
      base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com}
      api-key: ${NVIDIA_API_KEY:}
      # NVIDIA LLM API has no embeddings — disable so autoconfig skips the bean.
      embedding:
        enabled: false
      chat:
        options:
          # INSTRUCT model (no reasoning). Reasoning models (e.g. stepfun-ai/step-3.7-flash) blow
          # time/tokens reranking ~50 candidates (>180s, finish_reason=length) and always fall back
          # to the heuristic. Higher-quality/slower alternative: meta/llama-3.3-70b-instruct.
          model: ${NVIDIA_MODEL:meta/llama-3.1-8b-instruct}
          temperature: 0.2
          # NVIDIA LLM API requires max-tokens; covers ~50 reranked items in JSON.
          max-tokens: ${NVIDIA_MAX_TOKENS:4096}

# NVIDIA LLM API HTTP client timeouts. Spring AI 1.0.3 exposes no timeout property for the OpenAI
# client and its default RestClient has no read-timeout, so NvidiaChatConfig applies these to the
# OpenAiApi RestClient. read-timeout covers the hosted LLM inference.
nvidia:
  connect-timeout-ms: ${NVIDIA_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${NVIDIA_READ_TIMEOUT_MS:60000}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
  public-url: ${KEYCLOAK_PUBLIC_URL:http://localhost:8180}
  realm: ragro
  admin:
    username: ${KEYCLOAK_ADMIN:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD}

minio:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  media-public-url: ${MEDIA_PUBLIC_URL:http://localhost:8080}
  region: ${STORAGE_REGION:us-east-1}
  access-key: ${STORAGE_ACCESS_KEY}
  secret-key: ${STORAGE_SECRET_KEY}
  bucket: ${STORAGE_BUCKET:ragro-media}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    use-root-path: true

swagger:
  production-url: ${SWAGGER_PRODUCTION_URL:}

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}

ragro:
  recommendations:
    rerank:
      # Toggle the AI reranker. Off = heuristic ordering only.
      enabled: ${RECOMMENDATION_RERANK_ENABLED:true}
    cache:
      # Per-customer ranking cache (Caffeine). On: hits return in ms, LLM runs async at most
      # 1x/customer/TTL (or after a new order — event eviction). Off: rerank runs synchronously per call.
      enabled: ${RECOMMENDATION_CACHE_ENABLED:true}
      ttl-hours: ${RECOMMENDATION_CACHE_TTL_HOURS:6}
  tracking:
    # Real-time tracking (WebSocket/STOMP). Off: /ws channel doesn't start and
    # GET /orders/{id}/tracking returns available=false (app falls back to the no-map flow).
    enabled: ${TRACKING_ENABLED:true}
    retention-days: ${TRACKING_RETENTION_DAYS:7}
  rate-limit:
    # In-memory token bucket (RateLimitFilter): register/forgot per IP; recommendations/routes
    # per user (LLM/Google cost). Limits are requests per minute.
    enabled: ${RATE_LIMIT_ENABLED:true}
    register-per-minute: ${RATE_LIMIT_REGISTER_PER_MINUTE:5}
    forgot-per-minute: ${RATE_LIMIT_FORGOT_PER_MINUTE:5}
    recommendations-per-minute: ${RATE_LIMIT_RECOMMENDATIONS_PER_MINUTE:10}
    routes-per-minute: ${RATE_LIMIT_ROUTES_PER_MINUTE:10}

server:
  error:
    include-message: never

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
  # Routes API: explicit timeouts (Boot's default RestClient has no read-timeout — a stuck call
  # would block the worker and prevent transport retry) + retry backoff for transient transport
  # failures (DNS/connection). Read 10s because computeRoutes (TRAFFIC_AWARE + order optimization)
  # legitimately takes a few seconds.
  routes:
    connect-timeout-ms: ${GOOGLE_ROUTES_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${GOOGLE_ROUTES_READ_TIMEOUT_MS:10000}
    retry:
      backoff-ms: ${GOOGLE_ROUTES_RETRY_BACKOFF_MS:200}

firebase:
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
