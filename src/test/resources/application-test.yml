spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ragro}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres123}

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/mock-jwks

  # Dummy key so the OpenAI/NVIDIA autoconfig builds the ChatModel bean at context startup.
  # No test invokes the reranker, so no outbound call is ever made.
  ai:
    openai:
      api-key: test-key

# Resolve os placeholders sem default do application.yml (credenciais são fail-fast em prod).
# Nenhum teste fala com Keycloak/MinIO reais — os clients são construídos mas nunca conectam.
keycloak:
  admin:
    password: test-admin

ragro:
  rate-limit:
    # Desligado nos testes para não interferir em suítes que repetem chamadas ao mesmo endpoint.
    # O RateLimitFilterTest reabilita via @TestPropertySource.
    enabled: false

minio:
  access-key: test-access
  secret-key: test-secret
