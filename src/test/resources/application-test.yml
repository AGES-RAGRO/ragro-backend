spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ragro}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres123}

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/mock-jwks

  # Dummy key so the OpenAI/NVIDIA autoconfig builds the ChatModel bean at context startup.
  # No test invokes the reranker, so no outbound call is ever made.
  ai:
    openai:
      api-key: test-key

# Fills application.yml placeholders that have no default (fail-fast in prod). No test hits real
# Keycloak/MinIO — clients are built but never connect.
keycloak:
  admin:
    password: test-admin

ragro:
  rate-limit:
    # Off in tests so suites can repeat calls to the same endpoint. RateLimitFilterTest re-enables
    # via @TestPropertySource.
    enabled: false

minio:
  access-key: test-access
  secret-key: test-secret
