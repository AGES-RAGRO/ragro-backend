name: Terraform Plan

# Roda SÓ quando algo em infra/ muda — não dispara nos pushes normais de código.
# É read-only: faz fmt/validate/plan e comenta o resultado na PR. Não aplica nada.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  plan:
    name: Plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    # Um job por ambiente. Cada ambiente usa as credenciais (secrets) e os
    # valores (variables) do GitHub Environment de mesmo nome.
    strategy:
      fail-fast: false
      matrix:
        env: [ages, prod]
    environment: ${{ matrix.env }}
    env:
      TF_VAR_environment: ${{ matrix.env }}
      TF_VAR_kms_key_id: ${{ vars.RDS_KMS_KEY_ARN }}
      TF_VAR_monitoring_role_arn: ${{ vars.RDS_MONITORING_ROLE_ARN }}
      TF_VAR_db_subnet_group_name: ${{ vars.RDS_DB_SUBNET_GROUP }}
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.MY_AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform init
        id: init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}" \
            -backend-config="key=${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=us-east-2" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: terraform plan -input=false -no-color
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const env = '${{ matrix.env }}';
            const marker = `<!-- tf-plan-${env} -->`;
            const plan = (process.env.PLAN || '').substring(0, 60000);
            const body = `${marker}
            > [!WARNING]
            > **Este PR altera \`infra/\`.** Aprovar e mergear na \`main\` vai **APLICAR** estas mudanças na conta AWS \`${env}\` automaticamente (workflow _Terraform Apply_). A aprovação do PR é o gate humano — revise o plan abaixo com atenção.

            ### Terraform — ambiente \`${env}\`
            #### \`fmt\` \`${{ steps.fmt.outcome }}\` · \`init\` \`${{ steps.init.outcome }}\` · \`validate\` \`${{ steps.validate.outcome }}\` · \`plan\` \`${{ steps.plan.outcome }}\`

            <details><summary>Mostrar plan</summary>

            \`\`\`terraform
            ${plan}
            \`\`\`

            </details>

            *Workflow: \`${{ github.workflow }}\` — disparado por @${{ github.actor }}*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            // Sinaliza visualmente na lista de PRs que este toca a infra.
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['infra'],
              });
            } catch (e) {
              core.warning(`Não consegui aplicar a label 'infra': ${e.message}`);
            }

      - name: Fail if checks failed
        if: steps.fmt.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: exit 1
